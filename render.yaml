# Render Blueprint — Deploy Backend API + Frontend Static Site
#
# Usage: Render Dashboard -> New -> Blueprint -> Select this repo -> Apply.
# For detailed instructions and FAQ, see docs/DEPLOY_RENDER.md.
#
# Architecture: Decoupled frontend and backend defining two services:
#   1) addressbook-api: Flask + gunicorn Web Service (Python)
#   2) addressbook-web: Vite build output dist/ Static Site
# Backend enables CORS via CORS_ORIGINS; frontend API base URL is injected
# at build time via VITE_API_BASE_URL (falls back to relative /api/v1 if unset).

services:
  # ---------- Backend API ----------
  - type: web
    name: addressbook-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render injects port via $PORT; must bind 0.0.0.0; single worker with threads is optimal for SQLite.
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --threads 4 wsgi:app
    healthCheckPath: /api/v1/contacts
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Allowed CORS origins for frontend, separated by commas.
      # "*" allows any origin (acceptable for demos without auth cookies);
      # Change to https://addressbook-web.onrender.com for production.
      - key: CORS_ORIGINS
        value: "*"
      # Database file path. Defaults to backend/instance/address_book.sqlite3 (ephemeral filesystem).
      # For persistence, refer to docs/DEPLOY_RENDER.md "Data Persistence":
      #   Change plan to starter, uncomment disk below, and set DATABASE to /var/data/address_book.sqlite3
      # - key: DATABASE
      #   value: /var/data/address_book.sqlite3
    # disk:
    #   name: addressbook-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------- Frontend Static Site ----------
  - type: web
    name: addressbook-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Vue Router uses history mode; rewrite routes like /settings to /index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # Production build defaults to real backend; declared explicitly to avoid mock usage.
      - key: VITE_USE_MOCK
        value: "false"
      # Backend API root URL. Set the actual addressbook-api URL after deployment, e.g.:
      #   https://addressbook-api.onrender.com/api/v1
      # Note: Re-deployment with "Clear build cache & deploy" is required after modification.
      - key: VITE_API_BASE_URL
        sync: false
