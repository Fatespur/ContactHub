# Render Blueprint — Deploy Backend API + Frontend Static Site
#
# ContactHub Architecture: Decoupled frontend and backend defining two services:
#   1) contacthub-api: Flask + gunicorn Web Service (Python)
#   2) contacthub-web: Vite build output dist/ Static Site
#
# SECURITY & PRIVACY NOTICE:
# The REST API currently operates in unauthenticated mode for demonstration purposes.
# Do NOT upload real, sensitive, or personally identifiable contact data to public instances.
# In production deployments, configure reverse-proxy authentication (e.g. OAuth/JWT/Basic Auth)
# and restrict CORS_ORIGINS to authorized frontend origins.

services:
  # ---------- Backend API ----------
  - type: web
    name: contacthub-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --threads 4 wsgi:app
    healthCheckPath: /api/v1/contacts
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Allowed CORS origins. Restricted to frontend domain for demo security.
      # For local testing, requests go through the Vite reverse proxy.
      - key: CORS_ORIGINS
        value: "https://contacthub-web.onrender.com"
      # Database file path. Defaults to backend/instance/address_book.sqlite3 (ephemeral).
      # On Render free tier, ephemeral storage automatically purges demo data across restarts.
      # For production persistence with disk, upgrade to Starter and mount /var/data:
      # - key: DATABASE
      #   value: /var/data/contacthub.sqlite3
    # disk:
    #   name: contacthub-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------- Frontend Static Site ----------
  - type: web
    name: contacthub-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # Default to client-side Mock mode for safe, cold-start-free public showcase
      # (runs purely in frontend memory, eliminating unauthenticated backend abuse risks)
      - key: VITE_USE_MOCK
        value: "true"
      # For live backend integration: change VITE_USE_MOCK to "false" and set VITE_API_BASE_URL
      # e.g., value: "https://contacthub-api.onrender.com/api/v1"
      - key: VITE_API_BASE_URL
        sync: false
